<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Kenneth Buncaras</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Our own design file -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== NAVIGATION BAR ===== -->
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">Kenneth Buncaras</a>

        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills &amp; Services</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="projects.html" class="active">Projects</a></li>
            <li><a href="testimonials.html">Testimonials</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <!-- ===== FEATURED PROJECTS ===== -->
      <section class="section page-top">
        <div class="container">
          <div class="section-header">
            <p class="section-label">Featured Projects</p>
            <h2 class="section-title">Projects &amp; Solutions I've Created</h2>
          </div>

          <div class="project-grid" id="featured-grid">
            <p>Loading projects...</p>
          </div>
        </div>
      </section>

      <!-- ===== ALL PROJECTS (GALLERY WITH FILTERS) ===== -->
      <section class="section section-gray">
        <div class="container">
          <div class="section-header">
            <p class="section-label">All Projects</p>
            <h2 class="section-title">Browse everything I have created</h2>
          </div>

          <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="monitoring">Monitoring</button>
            <button class="filter-btn" data-filter="calculators">Calculators</button>
            <button class="filter-btn" data-filter="inventory">Inventory</button>
            <button class="filter-btn" data-filter="design">Design</button>
          </div>

          <div class="project-grid" id="all-grid"></div>
        </div>
      </section>
    </main>

    <!-- Supabase helper code (loaded from the internet) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Our own files: order matters -->
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/projects.js"></script>
